<meta charset="utf-8">
<title>72 Union Street</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="css/desk.css">
<style>
/* Layout: the game fills the whole screen; a small HUD sits in the corners, cards open over the play. */
:root{
  --wall:#07070a;      /* behind the stage */
  --paper:#e2dac6;     /* card stock */
  --ink:#151820;       /* ink on card */
  --dim:#9ea3ad;       /* secondary text */
  --red:#a8432f;       /* index-card red rule */
  --f-display:"IM Fell English SC","IM Fell English",Georgia,"Times New Roman",serif;
  --f-body:"IM Fell English",Georgia,"Times New Roman",serif;
  --f-type:"Special Elite","Courier New",Courier,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--wall);color:var(--paper)}
body{font-family:var(--f-body);font-size:17px;line-height:1.5;overscroll-behavior:none}
.viewport{position:fixed;inset:0;background:var(--wall);overflow:hidden;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;-webkit-tap-highlight-color:transparent}
.viewport>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
.hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));font-family:var(--f-type);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper);background:rgba(8,10,14,.6);padding:5px 9px;border:1px solid rgba(226,218,198,.18);pointer-events:none}
.hud.left{left:calc(14px + env(safe-area-inset-left,0px))}
.hud.right{right:calc(14px + env(safe-area-inset-right,0px));color:var(--dim);text-transform:none;letter-spacing:.02em;transition:opacity .8s ease}
.hud .count{color:var(--dim);margin-left:10px}
.prompt{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-type);font-size:14px;background:var(--paper);color:var(--ink);padding:6px 11px;box-shadow:3px 3px 0 rgba(0,0,0,.6);cursor:pointer;white-space:nowrap}
.prompt kbd{font-family:var(--f-type);border:1.5px solid var(--ink);padding:0 5px;margin-right:6px}
.intro{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-1deg);text-align:center;pointer-events:none;padding:14px 34px 18px;background:var(--paper);color:var(--ink);box-shadow:5px 6px 0 rgba(0,0,0,.55);transition:opacity .6s ease;clip-path:polygon(0 6%,3% 0,40% 3%,72% 0,100% 4%,99% 50%,100% 96%,62% 100%,30% 97%,2% 100%,0 55%)}
.intro small{display:block;font-family:var(--f-type);font-size:clamp(10px,1.2vw,13px);letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.intro b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4vw,44px);line-height:1.05}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-type);color:var(--dim);letter-spacing:.1em;background:var(--wall)}
/* the catalogue card that opens on an exhibit */
.cardwrap{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,6,9,.45);padding:12px}
.icard{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);padding:18px 22px 22px;box-shadow:5px 6px 0 rgba(0,0,0,.6);
  background-image:linear-gradient(var(--red),var(--red)),repeating-linear-gradient(to bottom,transparent 0 25px,rgba(125,147,168,.35) 25px 26px);background-size:100% 2px,100% 100%;background-position:0 50px,0 56px;background-repeat:no-repeat}
.icard .no{font-family:var(--f-type);font-size:12px;letter-spacing:.08em;display:flex;justify-content:space-between;gap:8px;padding-right:34px}
.icard h3{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3vw,30px);line-height:1.05;margin:14px 0 10px}
.icard .label{font-family:var(--f-type);font-size:13px;line-height:1.45;border:1.5px solid var(--ink);padding:8px 10px;margin:0 0 10px;background:rgba(255,255,255,.35)}
.icard .label span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:3px}
.icard p{margin:0 0 8px;font-size:16.5px;line-height:26px}
.icard .now{border-top:1.5px dashed rgba(21,24,32,.45);padding-top:8px;margin-top:6px}
.icard .now b{font-family:var(--f-type);font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);display:block}
.close{position:absolute;right:10px;top:8px;font-family:var(--f-type);font-size:18px;background:none;border:1.5px solid var(--ink);color:var(--ink);width:30px;height:30px;cursor:pointer;line-height:1}
.close:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (max-width:560px){.hud.right{display:none}}
</style>

<div class="viewport" id="vp" tabindex="-1" aria-label="A walkable museum. Use the arrow keys or W A S D to walk, E to examine. Or tap the floor to walk and tap an exhibit to examine it.">
  <canvas id="c"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="hud left"><span id="room">Entrance Hall</span><span class="count" id="count"></span></div>
  <div class="hud right" id="keyhint" aria-hidden="true">WASD or arrows to walk &middot; E to examine &middot; or tap the floor</div>
  <div class="obj" id="obj" aria-live="polite"></div>
  <div class="prompt" id="prompt" hidden></div>
  <button class="menubtn" id="menubtn" type="button" title="Start the game again from the beginning (for a new student)">Start over</button>
  <div class="dlg" id="dlg" role="dialog" aria-live="polite" tabindex="-1" hidden>
    <canvas class="dlg-face" id="dlgface" width="96" height="96" aria-hidden="true"></canvas>
    <div><div class="dlg-who" id="dlgwho"></div><p class="dlg-text" id="dlgtext"></p><div class="dlg-choices" id="dlgchoices"></div><div class="dlg-more" id="dlgmore"></div></div>
    <div class="dlg-cardslot" id="dlgcard" hidden></div>
  </div>
  <div class="intro" id="intro" aria-hidden="true"><small>Saint John, N.B. &middot; 1910</small><b>72 Union Street</b></div>
  <div class="cardwrap" id="cardwrap" hidden>
    <article class="icard" id="card" role="dialog" aria-modal="true" aria-labelledby="ctitle">
      <button class="close" id="close" type="button" aria-label="Close card">&times;</button>
      <div class="no"><span id="cno"></span><span id="croom"></span></div>
      <h3 id="ctitle"></h3>
      <div class="label" id="clabel"><span>The museum&rsquo;s label</span><div id="clabeltext"></div></div>
      <div id="cbody"></div>
    </article>
  </div>
  <div class="loading" id="loading">Unlocking the doors&hellip;</div>
</div>

<div class="overlays" id="overlays"></div>
<div class="fade" id="fade" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/story.js"></script>
<script src="js/world.js"></script>
<script type="module" src="js/desk/main.js"></script>
